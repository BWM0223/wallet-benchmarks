[package]
name = "tari-wallet-benchmarks"
version = "0.1.0"
edition = "2021"
authors = ["BWM0223"]
description = "Reproducible performance test harness for minotari wallet modes"
license = "BSD-3-Clause"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tonic = "0.12"
prost = "0.13"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
sysinfo = "0.32"
rand = "0.8"
anyhow = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
